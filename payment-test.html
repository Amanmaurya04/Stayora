<!DOCTYPE html>
<html>
<head>
  <title>Stayora Experience Payment Test</title>
</head>

<body>

  <h2>Stayora Experience Payment Test</h2>

  <button onclick="payNow()">Pay Now</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    async function payNow() {

      // Apni actual ExperienceBooking ID yahan daalo
      const bookingId = "6aa05498b1afc9d5312d91c1";

      // Apna JWT token yahan daalo
      const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhOTFkMjc1ZGE3MTkyZjk3Zjg3MjVjNiIsImlhdCI6MTc4ODg5MjAwNywiZXhwIjoxNzg4OTc4NDA3fQ.vS2Ck181Jp4QiTNIu8snfZubybda87L9D8xNvDvqQ7o";


      // 1. Create Razorpay order
      const response = await fetch(
        "http://localhost:8000/api/experience-payments/create-order",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },

          body: JSON.stringify({
            bookingId: bookingId
          })
        }
      );

      const data = await response.json();

      console.log("Create Order Response:", data);


      if (!response.ok) {
        alert(data.message);
        return;
      }


      // 2. Open Razorpay Checkout
      const options = {

        key: data.key,

        amount: data.amount,

        currency: data.currency,

        name: "Stayora",

        description: "Experience Booking Payment",

        order_id: data.orderId,


        handler: async function (payment) {

          console.log("Payment Response:", payment);


          // 3. Verify payment
          const verifyResponse = await fetch(
            "http://localhost:8000/api/experience-payments/verify-payment",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
              },

              body: JSON.stringify({

                bookingId: bookingId,

                razorpay_order_id:
                  payment.razorpay_order_id,

                razorpay_payment_id:
                  payment.razorpay_payment_id,

                razorpay_signature:
                  payment.razorpay_signature

              })
            }
          );


          const verifyData = await verifyResponse.json();

          console.log("Verify Response:", verifyData);

          alert(verifyData.message);

        }
      };


      const razorpay = new Razorpay(options);

      razorpay.open();

    }
  </script>

</body>
</html>
